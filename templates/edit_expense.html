{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1 class="auth-title">Edit Expense</h1>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}" class="auth-form">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    class="form-input"
                    step="0.01"
                    min="0.01"
                    placeholder="0.00"
                    value="{{ amount if amount is defined else expense.amount }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-input" required>
                    <option value="" disabled>Select a category</option>
                    {% set selected_category = category if category is defined else expense.category %}
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if cat == selected_category %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    class="form-input"
                    value="{{ date if date is defined else expense.date }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description <span class="label-optional">(optional)</span></label>
                <input
                    type="text"
                    id="description"
                    name="description"
                    class="form-input"
                    maxlength="200"
                    placeholder="e.g. Grocery run"
                    value="{{ description if description is defined else (expense.description or '') }}"
                >
            </div>

            <button type="submit" class="btn-submit">Save Changes</button>
        </form>

        <p class="auth-footer">
            <a href="{{ url_for('profile') }}">Cancel</a>
        </p>
    </div>
</div>
{% endblock %}
